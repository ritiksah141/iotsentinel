version: 2
updates:
  # Python dependencies (desktop + Pi requirement sets live at the repo root).
  # Monthly to keep PR churn low; everything lands in one grouped PR.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      python-dependencies:
        patterns:
          - "*"
    # Major bumps of these packages carry breaking API/ABI changes (Dash 2->4,
    # numpy 1->2, pandas 2->3, etc.) and must be done deliberately with full
    # local + Pi testing, never auto-merged. Minor/patch updates still flow.
    ignore:
      - dependency-name: "dash"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dash-bootstrap-components"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dash-cytoscape"
        update-types: ["version-update:semver-major"]
      - dependency-name: "plotly"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webauthn"
        update-types: ["version-update:semver-major"]
      # scikit-learn and river are pinned as an ABI-coupled set with numpy<2
      # (see requirements.txt). scikit-learn's own version stays on "1.x" well
      # past what's actually ABI-compatible (1.9.0 already requires numpy>=2),
      # so semver-major alone doesn't catch it — block minor bumps too, patch
      # only. Same coupling applies to river; it had no ignore rule before.
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "river"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions used by the CI / image-build workflows.
  # Grouped so all action bumps arrive as a single PR, not one per action.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
